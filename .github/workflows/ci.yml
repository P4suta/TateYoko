name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true

      - name: Install pinned PowerShell analyzer
        run: mise exec -- just setup-powershell

      - name: Format, compile, contract-test, coverage, audit, notices, and mutation
        run: mise exec -- just ci

      - name: Prove x64/ARM64 MSIX packaging
        run: mise exec -- just dist-build 0.0.1

      - name: Upload diagnostic quality reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports
          path: |
            build/coverage
            build/legal
            src/TateYoko.Engine/StrykerOutput
          if-no-files-found: warn
          retention-days: 7

  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject vulnerable or disallowed new dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT,
            MS-PL, Unicode-3.0, Zlib

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the complete Git history for credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  codeql:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality
          config-file: ./.github/codeql-config.yml

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true

      - name: Locked restore and strict build
        run: |
          mise exec -- just restore-locked
          mise exec -- just build

      - name: Analyze without publishing unfiltered generated findings
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:csharp
          upload: never
          post-processed-sarif-path: build/codeql-sarif

      - name: Remove generated findings and reject every source warning or error
        run: ./.config/Test-CodeQlSarif.ps1 -Path build/codeql-sarif

      - name: Upload the filtered source analysis
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: build/codeql-sarif
          category: /language:csharp

  # Keep this job id stable: the default-branch ruleset requires the `test` context.
  # It is deliberately an aggregator so no PR can merge while a security job is failing.
  test:
    if: ${{ always() }}
    needs: [quality, dependency-review, secrets, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality and security gate
        env:
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$QUALITY_RESULT" = "success"
          test "$SECRETS_RESULT" = "success"
          test "$CODEQL_RESULT" = "success"
          test "$DEPENDENCY_REVIEW_RESULT" = "success" \
            || test "$DEPENDENCY_REVIEW_RESULT" = "skipped"
