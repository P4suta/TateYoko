name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  quality:
    name: quality
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Upload the CodeQL results from the verified build.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
      - name: Install pinned PowerShell analyzer
        run: mise exec -- just setup-powershell
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality
          config-file: ./.github/codeql-config.yml
      - name: Verify contracts, rendering, coverage, dependencies, and notices
        run: mise exec -- just ci
      - name: Analyze source
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:csharp
          upload: never
          post-processed-sarif-path: build/codeql-sarif
      - name: Reject source findings
        run: ./.config/Test-CodeQlSarif.ps1 -Path build/codeql-sarif
      - name: Upload source analysis
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: build/codeql-sarif
          category: /language:csharp

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      MISE_ENABLE_TOOLS: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the reviewed dependency graph
        env:
          LOCK_GRAPH_SHA256: ${{ hashFiles('**/packages*.lock.json') }}
        run: |
          printf 'NuGet lock graph SHA-256: %s\n' "$LOCK_GRAPH_SHA256"
      - name: Reject vulnerable or disallowed new dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT,
            MS-PL, Unicode-3.0, Zlib
          # These metadata corrections apply only to the reviewed dependency graphs.
          # Any changed graph clears them because the action ignores package URL versions.
          allow-dependencies-licenses: >-
            ${{ hashFiles('**/packages*.lock.json') == '91a90a1a2eff6bd3d8778101ca4ff11424f89d6591d622ae52cb8f83bd9807b5' &&
                'pkg:nuget/Microsoft.Windows.SDK.BuildTools@10.0.28000.2705,pkg:nuget/Microsoft.WindowsAppSDK.Foundation@2.3.12,pkg:nuget/Microsoft.WindowsAppSDK.InteractiveExperiences@2.1.9,pkg:nuget/Microsoft.WindowsAppSDK.Runtime@2.5.1,pkg:nuget/Microsoft.WindowsAppSDK.WinUI@2.3.9,pkg:nuget/Magick.NET-Q16-AnyCPU@15.0.0' || '' }}

      - name: Install the pinned restore toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: dotnet
      - name: Verify Linux dependency restore
        run: |
          mise exec -- dotnet --version
          mise exec -- dotnet restore TateYoko.slnx --locked-mode
          git diff --exit-code

  secrets:
    name: secrets
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  test:
    name: test
    if: always()
    needs: [quality, dependency-review, secrets]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every quality and security gate
        env:
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: |
          set -euo pipefail
          test "$QUALITY_RESULT" = "success"
          test "$SECRETS_RESULT" = "success"
          test "$DEPENDENCY_REVIEW_RESULT" = "success" \
            || test "$DEPENDENCY_REVIEW_RESULT" = "skipped"

  required:
    name: required
    if: always()
    needs: [test]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful verification
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = "success"
