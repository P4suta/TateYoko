name: release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Numeric release tag (vX.Y.Z); use v0.0.1 for a smoke test"
        required: true
        type: string
      sha:
        description: "Exact commit/ref to build; defaults to tag_name"
        required: false
        type: string
      publish:
        description: "Publish the approved draft release"
        required: false
        # Manual dispatches are dry-run by default. release-please explicitly opts in only after
        # it has created the immutable tag and draft Release.
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  REF: ${{ inputs.sha || inputs.tag_name }}
  TAG: ${{ inputs.tag_name }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Validate immutable release coordinates
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "tag_name must be vX.Y.Z, got '$env:TAG'."
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the tag, requested ref, and default branch identify one commit
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-list -n 1 $env:TAG).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $tagCommit) {
            throw "REF resolves to $head but $env:TAG resolves to $tagCommit."
          }
          git merge-base --is-ancestor $head origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release commit $head is not reachable from origin/main."
          }

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true

      - name: Re-run the complete merge gate
        run: mise exec -- just ci

      - name: Build and validate unsigned release inputs
        shell: pwsh
        run: |
          $version = $env:TAG.Substring(1)
          mise exec -- just dist-build $version
          mise exec -- just sbom $version

      - name: Upload only the files that cross the signing boundary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-signing-input
          path: |
            publish/unsigned/TateYoko.msixbundle
            publish/unsigned/TateYoko.appinstaller
          if-no-files-found: error
          retention-days: 1

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: |
            build/sbom/tateyoko.cdx.json
            build/sbom/tateyoko-sources.spdx
            build/legal/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    environment: release
    permissions:
      contents: read
    env:
      HAVE_SIGNING: >-
        ${{ secrets.ES_USERNAME != '' &&
            secrets.ES_PASSWORD != '' &&
            secrets.CREDENTIAL_ID != '' &&
            secrets.ES_TOTP_SECRET != '' }}
    steps:
      - name: Refuse an unsigned release
        shell: pwsh
        run: |
          if ($env:HAVE_SIGNING -ne 'true') {
            throw 'All four eSigner secrets are required; unsigned releases are forbidden.'
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true

      - name: Restore release tooling from lock files
        run: mise exec -- just restore-locked

      - name: Download unsigned signing input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-signing-input
          path: publish/unsigned

      - name: Stage the authoritative signing set
        shell: pwsh
        run: |
          $version = $env:TAG.Substring(1)
          mise exec -- just sign-stage $version

      - name: Authenticode-sign and timestamp the MSIX bundle
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${{ github.workspace }}\publish\sign-stage
          output_path: ${{ github.workspace }}\publish\signed
          environment_name: PROD
          malware_block: "true"

      - name: Collect and independently verify every signature
        shell: pwsh
        run: |
          $version = $env:TAG.Substring(1)
          mise exec -- just sign-collect $version

      - name: Upload verified signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-signed-artifacts
          path: publish/signed-artifacts
          if-no-files-found: error
          retention-days: 1

  package:
    needs: sign
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true

      - name: Restore release tooling from lock files
        run: mise exec -- just restore-locked

      - name: Download independently verified signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-signed-artifacts
          path: publish/signed-artifacts

      - name: Download SBOM and legal evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: build

      - name: Verify again at the irreversible boundary and package
        shell: pwsh
        run: |
          $version = $env:TAG.Substring(1)
          mise exec -- just sign-verify $version
          mise exec -- just package $version

      - name: Upload the exact verified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: publish/package
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    if: ${{ inputs.publish }}
    runs-on: windows-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the already verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: publish/package

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: publish/package/*

      - name: Attest the CycloneDX SBOM to shipped executables
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            publish/package/TateYoko.msixbundle
          sbom-path: publish/package/tateyoko.cdx.json

      - name: Publish the approved draft only after every gate passes
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.TAG }}
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          files: publish/package/*
